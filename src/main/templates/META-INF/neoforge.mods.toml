# Data-only mod: "lowcodefml" is the loader for mods without Java code.
modLoader="lowcodefml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="abandonedmoderncity"
    type="required"
    versionRange="[1.0.0,)"  # AMC 1.0.0 has the police_station theme; old 0.1.0 builds might not
    ordering="AFTER"  # loads after the AMC: this mod's tables (same paths) win
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tacz"
    type="required"
    versionRange="[1.2.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lrtactical"
    type="required"
    versionRange="[0.4.3,)"
    ordering="NONE"
    side="BOTH"

# First Aid is optional: its entries live in files with the neoforge:mod_loaded condition.
[[dependencies.${mod_id}]]
    modId="firstaid"
    type="optional"
    versionRange="[1.3.5,)"
    ordering="NONE"
    side="BOTH"

# Sophisticated Backpacks and TCT Flashlight (backpacks and flashlights in houses) are optional too: tables and loot
# modifiers with the neoforge:mod_loaded condition.
[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    type="optional"
    versionRange="[3.26.21,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="flashlight"
    type="optional"
    versionRange="[5.0,)"
    ordering="NONE"
    side="BOTH"
